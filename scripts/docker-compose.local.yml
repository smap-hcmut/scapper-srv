name: scapper-local-infra

services:
  rabbitmq:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.local-infra
    container_name: scapper-local-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-21042004}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: scapper-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-tantai}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-21042004}"
      MINIO_REGION_NAME: "${MINIO_REGION:-us-east-1}"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: scapper-local-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-tantai}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-21042004}"
      MINIO_BUCKET: "${MINIO_BUCKET:-ingest-data}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          echo "waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
    restart: "no"

volumes:
  rabbitmq_data:
  minio_data:
